name: Sum Test
on: push 

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - run: javac -d out $(find java/base java/sum -name "*.java") && java -ea -cp out sum.SumTest Base 3233 3435 3637 3839 4142 4749


